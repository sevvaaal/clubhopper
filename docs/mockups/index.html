<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clubhopper mockuplar</title>
<style>
  :root { --bg: #eceae4; --ink: #22201c; --muted: #6b675e; --line: #cfcbc0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.lead { margin: 0 0 26px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 28px; }
  figure { margin: 0; }
  .frame { position: relative; height: 520px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
  .frame iframe { width: 200%; height: 200%; border: 0; transform: scale(.5); transform-origin: 0 0; pointer-events: none; }
  figcaption { margin-top: 10px; }
  figcaption a { font-weight: 700; color: var(--ink); }
  figcaption span { display: block; color: var(--muted); }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Clubhopper ana sayfa mockupları</h1>
  <p class="lead">Beş yön, hepsi aynı içerikle: günün zinciri ve dört oyun. Tam ekran görmek için başlığa tıkla.</p>
  <div class="grid">
    <figure><div class="frame"><iframe src="a-arcade.html" title="Arcade" loading="lazy" tabindex="-1"></iframe></div>
      <figcaption><a href="a-arcade.html">A. Arcade kabini</a><span>Sayfa bir oyun salonu makinesi. Menü CRT ekranda, dört renkli düğme dört oyun.</span></figcaption></figure>
    <figure><div class="frame"><iframe src="b-langirt.html" title="Langırt" loading="lazy" tabindex="-1"></iframe></div>
      <figcaption><a href="b-langirt.html">B. Langırt masası</a><span>Yukarıdan bakılan masa. Her oyun bir çubuk, üstüne gelince adamlar kayıyor. Seri, skor boncukları.</span></figcaption></figure>
    <figure><div class="frame"><iframe src="c-mexico70.html" title="Mexico 70" loading="lazy" tabindex="-1"></iframe></div>
      <figcaption><a href="c-mexico70.html">C. Mexico 70 programı</a><span>Yeşil kâğıda basılmış eski maç programı. Bayrak şeridi yerine kulüp armaları, oyunlar içindekiler sayfası.</span></figcaption></figure>
    <figure><div class="frame"><iframe src="d-arma.html" title="Armalar" loading="lazy" tabindex="-1"></iframe></div>
      <figcaption><a href="d-arma.html">D. İşlemeli armalar</a><span>Gece stadyumunun önünde dikişli yamalar. Günün zinciri bir forma.</span></figcaption></figure>
    <figure><div class="frame"><iframe src="e-gece-maci.html" title="Gece maçı" loading="lazy" tabindex="-1"></iframe></div>
      <figcaption><a href="e-gece-maci.html">E. 16-bit gece maçı</a><span>Piksel stadyum. Skor tabelası günün zinciri, saha kenarı reklam panoları oyun menüsü.</span></figcaption></figure>
    <figure><div class="frame"><iframe src="f-armalar.html" title="Armalar ve istatistikler" loading="lazy" tabindex="-1"></iframe></div>
      <figcaption><a href="f-armalar.html">F. Armalar ve istatistikler</a><span>D'nin yamalarıyla başarılar sayfası. Kazanılan armalar dikili, kilitli olanlar sadece dikiş izi.</span></figcaption></figure>
  </div>
</main>
</body>
</html>
