<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clubhopper</title>
  <link rel="icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Barlow+Condensed:wght@500;600;700&family=Pixelify+Sans:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">
  <header class="topbar" id="topbar"></header>

  <main>
    <div class="goalmouth"></div>
    <section class="daily">
      <h1 id="daily-title"></h1>
      <div class="pair" id="pair"></div>
      <a class="play" id="play" href="chain.html"></a>
    </section>
    <h2 class="howto" id="how"></h2>
    <ol class="rods" id="rods"></ol>
    <div class="goalmouth bottom"></div>
  </main>

  <footer class="site-footer" id="footer"></footer>

  <script type="module">
    import { getLang, el, esc, loadGraph, avatar, rng, puzzleDate } from "./common.js";
    import { initLayout } from "./layout.js";
    import { getDaily } from "./daily.js";
    import { makePuzzle } from "./chain.js";

    // How to play the chain, one step per rod: [title, text, team colour, men on the rod]
    const STEPS = {
      tr: [
        ["İki oyuncu", "Bir başlangıç ve bir hedef oyuncu verilir.", "red", 2],
        ["Takım-sezon seç", "Elindeki oyuncunun oynadığı takımlardan ve sezonlardan birini seç.", "blue", 5],
        ["Takım arkadaşına geç", "O kadrodan bir oyuncu seç. Zincir bir halka uzar.", "red", 5],
        ["Hedefe ulaş", "Hedef oyuncuya en az adımla ulaş. Her gün yeni bir zincir gelir.", "blue", 3],
      ],
      en: [
        ["Two players", "You get a start player and a target player.", "red", 2],
        ["Pick a team-season", "Choose one of the teams and seasons your current player played in.", "blue", 5],
        ["Jump to a teammate", "Pick a player from that squad. The chain grows by one link.", "red", 5],
        ["Reach the target", "Get to the target in as few links as you can. A new chain every day.", "blue", 3],
      ],
    };
    const TEXT = {
      tr: { daily: "Günün zinciri", play: "Oyna", done: "Sonucunu gör", how: "Nasıl oynanır?" },
      en: { daily: "Daily chain", play: "Play", done: "See your result", how: "How to play" },
    };

    let lang = getLang();
    let puzzle = null, graph = null;

    const render = () => {
      const t = TEXT[lang];
      document.documentElement.lang = lang;
      el("daily-title").textContent = t.daily;
      el("play").textContent = getDaily("chain") ? t.done : t.play;
      el("how").textContent = t.how;
      el("rods").innerHTML = STEPS[lang].map(([title, text, team, men], i) => `
        <li class="${team}">
          <span class="rod"></span>
          <span class="men">${'<i class="man"></i>'.repeat(men)}</span>
          <span class="label"><b>${i + 1}. ${esc(title)}</b><small>${esc(text)}</small></span>
        </li>`).join("");
      if (puzzle) {
        const who = (pid) => `<span class="who">${esc(graph.data.players[pid].name)}</span>`;
        el("pair").innerHTML = `${avatar(graph.data, "players", puzzle.start, 52)} ${who(puzzle.start)}
          <span class="dots" aria-hidden="true">· · ·</span> ${who(puzzle.target)} ${avatar(graph.data, "players", puzzle.target, 52)}`;
      }
    };
    initLayout((next) => { lang = next; render(); });
    render();

    // Same seed as the chain page's daily mode, so the card shows today's real puzzle.
    // The data is large, so the menu shows first and the players fill in once it has loaded.
    graph = await loadGraph();
    puzzle = makePuzzle(graph, rng(puzzleDate()));
    render();
  </script>
</body>
</html>
